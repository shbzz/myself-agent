name: Application hygiene

on:
  pull_request: {}
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: application-hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check patch whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE...$REVISION"
          elif [[ "$EVENT_BEFORE" =~ ^0+$ ]]; then
            git diff --check "origin/main...$REVISION"
          else
            git diff --check "$EVENT_BEFORE" "$REVISION"
          fi
      - name: Scan application tree for common credentials
        env:
          REVISION: ${{ github.sha }}
        run: python3 competition/scripts/check_staged_secrets.py --revision "$REVISION" --path competition --path .github --path .githooks --path CONTRIBUTING.md
